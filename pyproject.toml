[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snowland-http"
version = "0.1.0"
description = "A rate-limited, parallel HTTP client with pluggable requests/httpx/aiohttp (or zero-dependency stdlib/urllib) backends."
requires-python = ">=3.8"
license = {file = "LICENSE"}
readme = "README.md"
dependencies = []  # No mandatory dependencies; transports are optional extras.

[project.optional-dependencies]
# Each transport is fully OPTIONAL. Install at least one.
requests = ["requests>=2.25.0"]      # sync backend
httpx = ["httpx>=0.24.0"]            # sync + async backend (recommended)
aiohttp = ["aiohttp>=3.8.0"]         # async backend
# "stdlib" is dependency-free (urllib) and works with no install at all; the
# extra is empty and exists only for documentation/discoverability. auto-detect
# falls back to it when no third-party transport is installed, or select it
# explicitly via HttpClient(backend="stdlib").
stdlib = []
all = [
    "requests>=2.25.0",
    "httpx>=0.24.0",
    "aiohttp>=3.8.0",
]

[tool.setuptools.packages.find]
include = ["snowland_http*"]
